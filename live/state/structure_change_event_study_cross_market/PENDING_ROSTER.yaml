# Cross-market structure-change event study — PENDING NQ APPROVAL
# Parent hub: live/state/structure_change_event_study_cross_market/
# Created: 2026-08-29
#
# Do NOT start Phase 1 on any row until:
#   1) NQ Phase 1–4 atlas is reviewed, AND
#   2) operators set APPROVAL_GATE.md → status: approved
#
# Engine / taxonomy inherit from:
#   live/state/nq_structure_change_event_study/STRUCTURE_CHANGE_RESEARCH_CONTRACT.yaml
#   live/state/nq_structure_change_event_study/EVENT_TAXONOMY.md
# Freeze rule identical: no pivot/lookback changes after seeing NQ results.

gate:
  depends_on: live/state/nq_structure_change_event_study/
  required_artifacts_before_review:
    - EXPANSION_ATLAS.md
    - CLOSE_VS_WICK.md
    - TIME_OF_CHANGE_ATLAS.md
    - ONE_HOUR_INCREMENTAL_VALUE.md
    - CAUSALITY_AUDIT.md
  approval_file: APPROVAL_GATE.md
  auto_start_on_nq_cpu_clear: false

shared_contract:
  structure_engine: StructureProgramEngine_v1_existing
  timeframes: ["4h primary", "1h secondary"]
  event_classes: [CLOSE_BREAK, WICK_REJECT, CLOSE_RECLAIM, TOUCH_ONLY]
  penetration_primary_min_ATR: 0.05
  also_report_zero_buffer: true

